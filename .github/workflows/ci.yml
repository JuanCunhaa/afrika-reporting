name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (versões fixadas em backend/constraints.txt)
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
      - name: Repo structure check
        run: python scripts/check_repo.py
      - name: .env.example contém só placeholders (não imprime valores)
        run: |
          if [ -f .env.example ]; then python scripts/check_env_example.py .env.example; else echo ".env.example ausente"; fi
      - name: Migrations em banco novo (upgrade, status, seed sintético)
        working-directory: backend
        env:
          AFRIKA_DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migrations.sqlite3
        run: |
          python -m app.cli migrate
          python -m app.cli db-status
          python -m app.cli seed-demo
          python -m app.cli migrate
      - name: Unit tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Motor de comparação visual (testes unitários, imagens sintéticas)
        run: npm run test:visual-unit

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PYTHON: python
      # F06B — BOOTSTRAP TEMPORÁRIO da referência visual Linux do caso `afrika` (novo): sem referência para a
      # plataforma, a regressão guarda as capturas como candidatas (artefato) e mede o ruído; os casos que já têm
      # referência (neutro/alternativo) continuam comparados. Remover no commit que versiona as referências revisadas.
      VISUAL_BOOTSTRAP: '1'
      VISUAL_MEASURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          python -m pip check
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Banco SQLite descartável criado pelo próprio webServer (migrate + seed sintético). Sem segredos.
      - name: Playwright E2E
        run: npm run test:e2e
      # Só dados SINTÉTICOS (capturas, manifestos, diffs e relatório da regressão visual).
      - name: Relatório de regressão visual (artefato)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression
          path: |
            frontend/test-results/visual/
            frontend/visual/tolerances.json
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (versões fixadas em backend/constraints.txt)
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
      - name: Repo structure check
        run: python scripts/check_repo.py
      - name: .env.example contém só placeholders (não imprime valores)
        run: |
          if [ -f .env.example ]; then python scripts/check_env_example.py .env.example; else echo ".env.example ausente"; fi
      - name: Migrations em banco novo (upgrade, status, seed sintético)
        working-directory: backend
        env:
          AFRIKA_DATABASE_URL: sqlite:///${{ runner.temp }}/ci-migrations.sqlite3
        run: |
          python -m app.cli migrate
          python -m app.cli db-status
          python -m app.cli seed-demo
          python -m app.cli migrate
      - name: Unit tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Motor de comparação visual (testes unitários, imagens sintéticas)
        run: npm run test:visual-unit

  export:
    name: Exportação PPTX/PDF (motor real, dados sintéticos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies (backend pelo lock + frontend)
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
          npm ci --prefix frontend
      - name: Build do renderizador (mesmo código da pré-visualização)
        run: npm run build --prefix frontend
      - name: Install Chromium (Playwright; usado pelo backend em modo headless, sem rede)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Sem PowerPoint nem ativos proprietários: PPTX/PDF gerados de dados SINTÉTICOS, reabertos e inspecionados
      # (objetos nativos, valores exatos, lacunas vazias, fontes, pacote determinístico, PDF válido). Com
      # AFRIKA_EXPORT_TESTS=required, motor indisponível FALHA em vez de pular.
      - name: Testes estruturais da exportação + validação de PPTX e PDF sintéticos
        env:
          AFRIKA_EXPORT_TESTS: required
        # F08: texto de interpretação aprovado e aplicado sai igual no HTML, PPTX e PDF, sem chamar provedor.
        # F09: fluxo ponta a ponta (cadastro → ... → PPTX/PDF → reinício) com as etapas de exportação obrigatórias.
        run: >-
          python -m pytest -q -rs backend/tests/test_export_units.py backend/tests/test_export_engine.py
          backend/tests/test_interpretation_export.py backend/tests/test_f09_acceptance.py

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: |
          python -m pip install -r ../backend/requirements.txt
          python -m pip check
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # F07: a exportação (export.spec.ts) renderiza com o build do frontend (dist + carimbo do código-fonte)
      - name: Build do renderizador (antes dos E2E de exportação)
        run: npm run build
      # Banco SQLite descartável criado pelo próprio webServer (migrate + seed sintético). Sem segredos.
      - name: Playwright E2E
        run: npm run test:e2e
      # Só dados SINTÉTICOS (capturas, manifestos, diffs e relatório da regressão visual).
      - name: Relatório de regressão visual (artefato)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression
          path: |
            frontend/test-results/visual/
            frontend/visual/tolerances.json
          if-no-files-found: warn
          retention-days: 14
